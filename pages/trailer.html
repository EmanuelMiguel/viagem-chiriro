<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Andada+Pro:ital,wght@0,400..840;1,400..840&family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Studio Ghibli - Trailer</title>
  </head>
  <body>
    <header class="header">
      <a class="logo" href="../index.html">
        <img src="../images/logo.svg" alt="Logo Studio Ghibli" />
      </a>

      <nav class="nav-links">
        <a
          href="https://studioghibli.com.br/studioghibli/"
          class="link"
          target="_blank"
        >
          <img src="../images/icones/logo-google.svg" alt="Ícone para Google" />
        </a>
        <a
          href="https://www.facebook.com/GhibliUSA/"
          class="link"
          target="_blank"
        >
          <img
            src="../images/icones/logo-facebook.svg"
            alt="Ícone para Facebook"
          />
        </a>
        <a href="https://x.com/GhibliUSA" class="link" target="_blank">
          <img
            src="../images/icones/logo-twitter.svg"
            alt="Ícone para Twitter(X)"
          />
        </a>
        <a
          href="https://www.instagram.com/ghibliusa/"
          class="link"
          target="_blank"
        >
          <img
            src="../images/icones/logo-instagram.svg"
            alt="Ícone para Instragram"
          />
        </a>
      </nav>
    </header>

    <main class="main-trailer">
      <div class="video-wrapper">
        <iframe
          class="video"
          src="https://www.youtube.com/embed/SgZI655GgHk?si=RRsEtTUEE9bFhMF1&rel=0&modestbranding=1"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
    </main>

    <footer>
      <p class="autor-created">Created by Emanuel Miguel</p>
    </footer>
  </body>
</html>
